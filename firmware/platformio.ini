; DeskBuddy C3 firmware - ESP32-C3 Super Mini
;
;   Upload:   PlatformIO "Upload" (or: pio run -t upload)
;   Monitor:  PlatformIO "Serial Monitor" (or: pio device monitor)  - type 'help'
;
; Everything is pinned to exact versions so the build is the same on every PC.
; Libraries are fetched as GitHub release archives (no git needed).

[platformio]
default_envs = c3

[common]
; pioarduino = Arduino-ESP32 core 3.3.6. The old core 2.0.x could not drive
; I2C on this Super Mini, so do not switch back to "platform = espressif32".
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board     = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
; warnings for our own code only (the libraries have plenty)
build_src_flags = -Wall -Wextra -Wno-unused-parameter
lib_deps =
    https://github.com/olikraus/U8g2_Arduino/archive/refs/tags/2.36.19.zip
    https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v7.4.3.zip
    https://github.com/h2zero/NimBLE-Arduino/archive/refs/tags/2.5.1.zip
    https://github.com/Links2004/arduinoWebSockets/archive/refs/tags/2.7.2.zip
    https://github.com/tzapu/WiFiManager/archive/refs/tags/v2.0.17.zip
; the C3's USB serial resets the chip when DTR/RTS toggle: keep them off
monitor_speed   = 115200
monitor_rts     = 0
monitor_dtr     = 0
monitor_eol     = LF
monitor_echo    = yes
monitor_filters = direct

; USB-powered build (no battery wired yet)
[env:c3]
extends = common

; once the battery, TP4056, slide switch and GPIO0 divider are fitted
[env:c3-battery]
extends = common
build_flags = ${common.build_flags} -DFEATURE_BATTERY=1

; later updates over WiFi (WiFi mode only): pio run -e ota -t upload
[env:ota]
extends = common
upload_protocol = espota
upload_port     = deskbuddy-c3.local
