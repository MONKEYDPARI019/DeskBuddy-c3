name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [c3, c3-battery]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/pyproject.toml
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO and esptool
        run: pip install "platformio>=6.1,<7" "esptool>=4.8,<6"
      - name: Build and merge
        run: python scripts/merge_firmware.py ${{ matrix.env }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: dist/
          retention-days: 14

  host-tests:
    name: firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sh firmware/test/host/run_tests.sh

  tool:
    name: tool (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: tool
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tool/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check src tests ../scripts
          python -m ruff format --check src tests ../scripts
      - name: Mypy (core)
        run: python -m mypy src/deskbuddy
      - name: Pytest
        run: python -m pytest --cov=deskbuddy --cov-report=term-missing --cov-fail-under=80

  android:
    name: android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for a Gradle wrapper
        id: wrapper
        shell: bash
        run: |
          if [ -f app/gradlew ] && [ -f app/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android build skipped::app/ has no Gradle wrapper (gradlew + gradle-wrapper.jar); the app is not built in CI."
          fi
      - uses: actions/setup-java@v6
        if: steps.wrapper.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        if: steps.wrapper.outputs.present == 'true'
        working-directory: app
        run: ./gradlew --no-daemon assembleDebug
