name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches FW_VERSION, the tool and the npm package
        run: |
          python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "tool/src")
          from pathlib import Path
          from deskbuddy import __version__ as tool
          from deskbuddy.versions import read_fw_version
          tag = os.environ["GITHUB_REF_NAME"]
          fw = read_fw_version(Path("firmware/src/config.h"))
          npm = json.loads(Path("npm/package.json").read_text(encoding="utf-8"))["version"]
          found = {
              "FW_VERSION in firmware/src/config.h": fw,
              "__version__ in tool/src/deskbuddy/__init__.py": tool,
              "version in npm/package.json": npm,
          }
          wrong = [f"{where} is {value}" for where, value in found.items() if f"v{value}" != tag]
          if wrong:
              print(f"::error::Tag {tag} does not match: " + "; ".join(wrong) + ". Bump them all and tag again.")
              sys.exit(1)
          print(f"Tag {tag} matches the firmware, the tool and the npm package")
          EOF
      - name: Install PlatformIO and esptool
        run: pip install "platformio>=6.1,<7" "esptool>=4.8,<6"
      - name: Build and merge both images
        run: python scripts/merge_firmware.py c3 c3-battery dist
      - name: Build debug APK (only if a Gradle wrapper exists)
        shell: bash
        run: |
          if [ -f app/gradlew ] && [ -f app/gradle/wrapper/gradle-wrapper.jar ]; then
            (cd app && ./gradlew --no-daemon assembleDebug)
            cp app/app/build/outputs/apk/debug/*.apk "dist/deskbuddy-app-${GITHUB_REF_NAME}-debug.apk"
          else
            echo "::notice title=No APK::app/ has no Gradle wrapper; the release contains firmware only."
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = match.group(1).strip() if match else f"DeskBuddy C3 v{version}"
          open("dist/RELEASE_NOTES.md", "w", encoding="utf-8").write(notes + "\n")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  program:
    # the ready-made deskbuddy program for each OS (what the npm package downloads) and DeskBuddy.exe
    uses: ./.github/workflows/app.yml

  publish:
    needs: [build, program]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: program-*
          merge-multiple: true
          path: dist
      - name: Checksums for every file
        run: |
          shopt -s nullglob
          cd dist
          sha256sum *.bin *.tar.gz *.exe *.apk > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DeskBuddy C3 $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.bin dist/*.tar.gz dist/*.exe dist/SHA256SUMS dist/manifest.json dist/*.apk

  npm:
    # Publishes npm/ as deskbuddy-c3 with npm trusted publishing (no token stored anywhere).
    # Off until the repository variable NPM_PUBLISH is "true"; see docs/development.md.
    needs: publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: npm new enough for trusted publishing
        run: npm install -g npm@latest
      - name: Repository URL exactly as GitHub spells it (npm checks it)
        run: npm pkg set repository.url="git+https://github.com/${GITHUB_REPOSITORY}.git"
      - run: npm test
      - run: npm publish --access public
