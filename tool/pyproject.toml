[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "deskbuddy-cli"
dynamic = ["version"]
description = "Flash, monitor and talk to a DeskBuddy C3 (ESP32-C3) board"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Parinith (MONKEYDPARI019)" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
# esptool 5.x needs Python >= 3.10, so Python 3.9 resolves to esptool 4.x.
# The tool supports both majors (see deskbuddy/esptool_compat.py).
dependencies = [
    "esptool>=4.8,<6",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
build = ["platformio>=6.1,<7"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.5"]

[project.scripts]
deskbuddy = "deskbuddy.cli:main"

[project.urls]
Homepage = "https://github.com/MONKEYDPARI019/DeskBuddy-C3"

[tool.hatch.version]
path = "src/deskbuddy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deskbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["deskbuddy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["*/deskbuddy/ui.py", "*/deskbuddy/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S603", "S101", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
